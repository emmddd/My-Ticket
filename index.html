<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Tickets">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<title>My Tickets</title>
<style>
/* Layout tuned for iPhone 16 Pro full screen: 402 x 874 pt (~9:19.5), Dynamic Island + home bar safe areas */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--u:min(calc(100vw / 402), calc(100dvh / 874), 1.15px)}
.full{top:0!important;left:0;right:0;bottom:auto!important;height:100vh!important;height:100lvh!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100vh;min-height:100lvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@font-face{font-family:"LockClock";src:url(clock.woff2) format("woff2");font-weight:500;font-display:block}
/* ---- iPhone-style lock screen ---- */
.lock{position:fixed;inset:0;height:100dvh;background:#140c09;color:#fff;overflow:hidden}
.wall{position:absolute;inset:0;background-size:cover;background-position:center}
.wall svg{width:100%;height:100%;display:block}
.ltop{position:relative;z-index:1;text-align:center;padding-top:calc(var(--sat) + 21px)}
.ldate{display:flex;justify-content:center;align-items:center;gap:12px;font-size:21px;font-weight:600;letter-spacing:-.01em;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.ldate .al{display:flex;align-items:center;gap:6px}
.ldate svg{width:20px;height:20px}
.time{font-family:"LockClock",-apple-system,sans-serif;font-weight:500;font-size:calc(var(--u) * 196);line-height:1;letter-spacing:-.02em;margin-top:calc(var(--u) * -12);
  display:inline-block;transform:scaleY(1.34);transform-origin:top center;
  background:linear-gradient(170deg,rgba(255,240,236,.95) 0%,rgba(222,196,190,.78) 38%,rgba(232,150,120,.72) 62%,rgba(170,150,150,.6) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.25)) drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.lbot{position:absolute;z-index:1;left:0;right:0;bottom:calc(var(--sab) + 16px);display:flex;justify-content:space-between;align-items:center;padding:0 calc(var(--u) * 46)}
.qb{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(40,28,24,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18)}
.qb svg{width:24px;height:24px;fill:#fff}
.notif{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.notif i{width:9px;height:9px;border-radius:50%;background:#fff}
.pass{position:fixed;inset:0;height:100dvh;background:#000;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:calc(var(--sat) + 15px) calc(var(--u) * 18) calc(var(--sab) + 8px);display:flex;flex-direction:column}
.pass.open{transform:translateY(0)}
.bar{display:none;justify-content:space-between;align-items:center;color:#fff;font-size:17px;margin-bottom:12px}
.bar button{background:none;border:none;color:#fff;font-size:17px;font-weight:600;padding:6px}
.track{flex:0 0 auto;overflow:hidden}
.slides{display:flex;transition:transform .3s}
/* ---- ticket card: every item is positioned on the card and editable ---- */
.tkw{flex:0 0 100%;display:flex;justify-content:center;filter:drop-shadow(0 6px 16px rgba(0,0,0,.55))}
.tk{position:relative;overflow:hidden;flex:0 0 auto}
/* light sweep across the ticket when it opens */
.tk::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none;z-index:1000}
.pass.open .tk::after{animation:shine 1.1s .45s ease-out}
@keyframes shine{to{transform:translateX(120%)}}
.el{position:absolute;white-space:pre-wrap;overflow-wrap:break-word;line-height:1.15}
.el.box{overflow:hidden;background-position:center;background-repeat:no-repeat}
.el.nfc svg{width:100%;height:100%;display:block;overflow:visible}
.demo{position:absolute;left:5.5%;bottom:3.4%;font:400 9px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:.02em;z-index:999;pointer-events:none}
.editfab{position:fixed;z-index:9;bottom:calc(var(--sab) + var(--u) * 65 + 28px);left:50%;margin-left:-26px;width:52px;height:52px;border-radius:50%;border:none;
  background:rgba(60,60,67,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.editfab.show{opacity:1;transform:scale(1);pointer-events:auto}
.editfab svg{width:22px;height:22px}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 0}
.dots:has(span:only-child){display:none}
.dots span{width:7px;height:7px;border-radius:50%;background:#4a4a4f;transition:background .2s,width .2s}
.dots span.on{background:#fff;width:16px;border-radius:4px}

/* ---- animated "Ready" indicator ---- */
/* ---- dark "Hold Near Reader" indicator ---- */
.ready{text-align:center;color:#fff;margin-top:calc(var(--u) * 58)}
.pass{transition:transform .45s cubic-bezier(.2,.8,.2,1),background-color .3s}
/* ---- other cards peeking up from the bottom (Wallet-style) ---- */
.stack{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u) * 65 + var(--sab));overflow:hidden;cursor:pointer;
  transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.pass.open .stack{transform:translateY(0);transition-delay:.25s}
.pass.open .stack.hide{transform:translateY(105%);transition-delay:0s}
.sc{position:absolute;height:calc(var(--u) * 240);border-radius:calc(var(--u) * 14);box-shadow:0 -2px 6px rgba(0,0,0,.45)}
.sc1{top:0;left:calc(var(--u) * 42);right:calc(var(--u) * 42);background:#2b2d31;
  background-image:linear-gradient(135deg,rgba(255,255,255,.07) 25%,transparent 25%),linear-gradient(225deg,rgba(255,255,255,.07) 25%,transparent 25%);background-size:calc(var(--u) * 20) calc(var(--u) * 20)}
.sc2{top:calc(var(--u) * 9);left:calc(var(--u) * 35);right:calc(var(--u) * 35);background:#97989b;
  background-image:linear-gradient(135deg,rgba(255,255,255,.18) 25%,transparent 25%),linear-gradient(225deg,rgba(0,0,0,.06) 25%,transparent 25%);background-size:calc(var(--u) * 30) calc(var(--u) * 20)}
.sc3{top:calc(var(--u) * 20);left:calc(var(--u) * 28);right:calc(var(--u) * 28);background:#1a1b1d}
.sc4{top:calc(var(--u) * 30);left:calc(var(--u) * 21);right:calc(var(--u) * 21);overflow:hidden;background:#2c62ad}
.sc4::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,.08),rgba(0,0,0,.25))}
.sc4 svg{position:absolute;inset:0;width:100%;height:100%}
.rwrap{position:relative;width:calc(var(--u) * 64);height:calc(var(--u) * 64);margin:0 auto;display:flex;align-items:center;justify-content:center}
.ring{position:relative;z-index:1;width:calc(var(--u) * 62);height:calc(var(--u) * 62);border-radius:50%;transform:scale(.6);opacity:0}
.pass.open .ring{animation:pop .5s .3s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{transform:scale(1);opacity:1}}
.ring .base{position:absolute;inset:0;width:100%;height:100%}
.ring .trace{fill:none;stroke:#3f8efc;stroke-width:6.5}
/* phone sits inside the ring and is cut off by its edge */
.clip{position:absolute;inset:6.5%;border-radius:50%;overflow:hidden}
.phone{position:absolute;left:50%;top:31%;width:48%;margin-left:-24%;transform:translateY(22px);opacity:0}
.pass.open .phone{animation:rise .6s .5s cubic-bezier(.2,.8,.2,1) forwards,hover 2.6s 1.4s ease-in-out infinite}
@keyframes rise{to{transform:translateY(0);opacity:1}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.rtext{margin-top:calc(var(--u) * 18);font-size:calc(var(--u) * 19.5);font-weight:400;color:#8e8e93;opacity:0;transform:translateY(6px)}
.pass.open .rtext{animation:fadeup .4s .9s forwards}
@keyframes fadeup{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pass.open .tk::after{animation:none}.pass.open .phone{animation:rise .01s forwards}}

/* ---- slide-style editor ---- */
.ed{position:fixed;inset:0;height:100dvh;background:#1c1c1e;color:#fff;z-index:10;transform:translateY(100%);transition:transform .35s;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab)}
.ed.open{transform:none}
.etop{display:flex;align-items:center;gap:4px;padding:6px 10px}
.etop button{background:none;border:none;color:#0a84ff;font-size:16px;font-weight:600;padding:6px 8px}
.etop button:disabled{color:#48484a}
.etop .sp{flex:1}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden;touch-action:none}
.ed .el{cursor:move;touch-action:none}
.ed .el.empty{outline:1px dashed rgba(255,255,255,.35);outline-offset:-1px}
.ed .el.empty::before{content:"Image";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 11px -apple-system,sans-serif;color:rgba(255,255,255,.35)}
.ed .el.sel{outline:1.5px solid #0a84ff;outline-offset:1px}
.hd{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #0a84ff;z-index:1001;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.ed .el.txt .hd{top:50%;bottom:auto;margin-top:-10px}
.gv,.gh{position:absolute;background:#ff2d95;z-index:1002;pointer-events:none;display:none}
.gv{top:0;bottom:0;width:1px}.gh{left:0;right:0;height:1px}
.tabs{display:flex;background:#2c2c2e;margin:8px 12px 0;border-radius:9px;padding:2px}
.tabs button{flex:1;background:none;border:none;color:#fff;font-size:14px;font-weight:500;padding:7px;border-radius:7px}
.tabs button.on{background:#636366}
.panel{height:38dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 16px;user-select:text;-webkit-user-select:text}
.panel label{display:block;font-size:12px;color:#98989f;margin:11px 0 4px}
.panel input[type=text],.panel textarea,.panel select{width:100%;font-size:16px;padding:9px;border:1px solid #3a3a3c;border-radius:8px;background:#2c2c2e;color:#fff;font-family:inherit}
.panel textarea{min-height:58px;resize:vertical}
.panel input[type=color]{width:100%;height:38px;border:1px solid #3a3a3c;border-radius:8px;background:#2c2c2e;padding:2px}
.panel input[type=range]{width:100%;accent-color:#0a84ff}
.rowx{display:flex;gap:8px;align-items:center}
.rowx>*{flex:1;min-width:0}
.rowx>.val{flex:0 0 46px;font-size:12px;color:#98989f;text-align:right}
.seg{display:flex;background:#2c2c2e;border-radius:8px;padding:2px;border:1px solid #3a3a3c}
.seg button{flex:1;background:none;border:none;color:#fff;padding:8px 4px;font-size:14px;border-radius:6px}
.seg button.on{background:#0a84ff}
.pbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pb{flex:1 1 30%;padding:10px 6px;font-size:14px;border:1px solid #3a3a3c;border-radius:10px;background:#2c2c2e;color:#fff;text-align:center}
.pb.dan{color:#ff453a}.pb.pri{background:#0a84ff;border-color:#0a84ff}
.hint{color:#98989f;font-size:13px;margin-top:12px;line-height:1.45}
.tnav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:15px}
.tnav button{background:#2c2c2e;border:1px solid #3a3a3c;color:#fff;border-radius:8px;width:44px;height:36px;font-size:18px}
</style>
</head>
<body>

<div class="lock full" id="lock">
  <div class="wall" id="wall">
    <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5a55"/><stop offset=".35" stop-color="#3a2d29"/><stop offset=".7" stop-color="#1a110d"/><stop offset="1" stop-color="#0d0705"/></linearGradient>
        <radialGradient id="ca" cx=".25" cy=".7" r=".9"><stop offset="0" stop-color="#8a7570"/><stop offset=".55" stop-color="#4a3a35"/><stop offset="1" stop-color="#2a1f1b"/></radialGradient>
        <radialGradient id="cb" cx=".35" cy=".25" r=".85"><stop offset="0" stop-color="#4c3f3b"/><stop offset=".6" stop-color="#241a16"/><stop offset="1" stop-color="#160e0b"/></radialGradient>
        <radialGradient id="cc" cx=".2" cy=".2" r="1"><stop offset="0" stop-color="#4a2214"/><stop offset=".6" stop-color="#25110a"/><stop offset="1" stop-color="#150905"/></radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#ff9a62" stop-opacity="0"/><stop offset=".45" stop-color="#ff8a4a" stop-opacity=".15"/><stop offset=".75" stop-color="#ff8a4a"/><stop offset="1" stop-color="#ff6a2a"/></linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter>
      </defs>
      <rect width="390" height="844" fill="url(#bg)"/>
      <!-- top-right sphere -->
      <circle cx="420" cy="20" r="335" fill="url(#ca)"/>
      <circle cx="420" cy="20" r="335" fill="none" stroke="#f3b49a" stroke-opacity=".35" stroke-width="1"/>
      <!-- bottom-right sphere -->
      <circle cx="560" cy="900" r="420" fill="url(#cc)"/>
      <circle cx="560" cy="900" r="420" fill="none" stroke="#ff7a3a" stroke-width="5" filter="url(#glow)" opacity=".55"/>
      <circle cx="560" cy="900" r="420" fill="none" stroke="#ffb07a" stroke-width="1.2"/>
      <!-- big centre-left sphere -->
      <circle cx="40" cy="430" r="296" fill="url(#cb)"/>
      <circle cx="40" cy="430" r="296" fill="none" stroke="url(#rim)" stroke-width="6" filter="url(#glow)" opacity=".85"/>
      <circle cx="40" cy="430" r="296" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
      <!-- lens where spheres overlap -->
      <path d="M318 522 C 250 560, 140 640, 92 748 C 170 720, 290 640, 318 522 Z" fill="#160b07"/>
      <path d="M318 522 C 250 560, 140 640, 92 748" fill="none" stroke="#ff7a36" stroke-width="5" filter="url(#glow)"/>
      <path d="M318 522 C 250 560, 140 640, 92 748" fill="none" stroke="#ffc09a" stroke-width="1.3"/>
      <path d="M92 748 C 170 720, 290 640, 318 522" fill="none" stroke="#ff6a26" stroke-width="3" filter="url(#glow)" opacity=".7"/>
      <!-- bottom sphere edge -->
      <circle cx="240" cy="1250" r="500" fill="url(#cc)"/>
      <circle cx="240" cy="1250" r="500" fill="none" stroke="#ff7030" stroke-width="6" filter="url(#glow)"/>
      <circle cx="240" cy="1250" r="500" fill="none" stroke="#ffb380" stroke-width="1.2"/>
    </svg>
  </div>
  <div class="ltop">
    <div class="ldate"><span id="ldate"></span>
      <span class="al"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="13" r="8"/><path d="M4.2 2.8 1.6 5.4l1.6 1.6 2.6-2.6zM19.8 2.8l-1.6 1.6 2.6 2.6 1.6-1.6z"/><path d="M12 8.5v5l3 1.8" stroke="#3a2d29" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Alarms Off</span>
    </div>
    <div class="time" id="ltime"></div>
  </div>
  <div class="lbot">
    <div class="qb"><svg viewBox="0 0 24 24"><path d="M7 2h10v3l-2 4v12a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V9L7 5z"/><circle cx="12" cy="13.5" r="1.3" fill="#3a2a25"/></svg></div>
    <div class="notif"><i></i>1 Notification</div>
    <div class="qb"><svg viewBox="0 0 24 24"><path d="M9 4h6l1.6 2.2H20a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.2a2 2 0 0 1 2-2h3.4z"/><circle cx="12" cy="13" r="3.6" fill="#3a2a25"/><circle cx="12" cy="13" r="2.4"/></svg></div>
  </div>
</div>

<div class="pass full" id="pass">
  <div class="bar"><button id="done">Done</button><button id="edit">Edit</button></div>
  <div class="track" id="track"><div class="slides" id="slides"></div></div>
  <div class="dots" id="dots"></div>
  <div class="ready">
    <div class="rwrap">
      <div class="ring">
        <svg class="base" viewBox="0 0 100 100" width="100" height="100"><circle class="trace" cx="50" cy="50" r="45"/></svg>
        <div class="clip">
          <svg class="phone" viewBox="0 0 46 80">
            <defs><clipPath id="pb"><rect x="2" y="2" width="42" height="90" rx="8"/></clipPath></defs>
            <rect x="2" y="2" width="42" height="90" rx="8" fill="#1d4384"/>
            <polygon points="0,26 46,58 46,95 0,95" fill="#0f2650" clip-path="url(#pb)"/>
            <rect x="2" y="2" width="42" height="90" rx="8" fill="none" stroke="#4a92f7" stroke-width="2.6"/>
            <rect x="16.5" y="7.5" width="13" height="3.4" rx="1.7" fill="#4a92f7"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="rtext">Hold Near Reader</div>
  </div>
  <button class="editfab" id="editfab" aria-label="Edit ticket"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
  <div class="stack" id="stack">
    <div class="sc sc1"></div><div class="sc sc2"></div><div class="sc sc3"></div>
    <div class="sc sc4" id="sc4"><svg viewBox="0 0 360 240" preserveAspectRatio="none" fill="none">
      <path d="M150 0 C 120 70, 70 150, 10 240" stroke="rgba(120,175,240,.30)" stroke-width="16"/>
      <path d="M265 0 C 225 90, 180 170, 140 240" stroke="rgba(120,175,240,.22)" stroke-width="12"/>
      <path d="M0 62 C 90 52, 200 35, 330 0" stroke="rgba(120,175,240,.25)" stroke-width="5"/>
    </svg></div>
  </div>
</div>

<div class="ed full" id="ed">
  <div class="etop">
    <button id="edDone">Done</button>
    <button id="undo" disabled>Undo</button>
    <span class="sp"></span>
    <button id="addT">＋ Text</button>
    <button id="addI">＋ Image</button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="tabs" id="tabs"><button data-tab="item">Item</button><button data-tab="card">Card</button><button data-tab="ticket">Ticket</button></div>
  <div class="panel" id="panel"></div>
  <input type="file" accept="image/*" id="fimg" hidden>
  <input type="file" accept="image/*" id="fwp" hidden>
  <input type="file" accept=".json,application/json" id="imp" hidden>
</div>

<script>
const KEY='myTicketsV1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const r2=v=>Math.round(v*100)/100;

const FONTS={
  'System':'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
  'Helvetica':'"Helvetica Neue",Helvetica,Arial,sans-serif',
  'Avenir':'"Avenir Next",Avenir,"Segoe UI",sans-serif',
  'Futura':'Futura,"Trebuchet MS",sans-serif',
  'Condensed':'"LockClock","Arial Narrow",sans-serif',
  'Impact':'Impact,"Arial Black",sans-serif',
  'Georgia':'Georgia,serif',
  'Didot':'Didot,"Bodoni 72","Times New Roman",serif',
  'Times':'"Times New Roman",Times,serif',
  'Courier':'"Courier New",Courier,monospace',
  'Typewriter':'"American Typewriter","Courier New",serif',
  'Marker':'"Marker Felt","Comic Sans MS",cursive'
};
const WEIGHTS=[[300,'Light'],[400,'Regular'],[500,'Medium'],[600,'Semibold'],[700,'Bold'],[800,'Heavy'],[900,'Black']];

/* ---------- data model: a ticket = card settings + a list of items ---------- */
const mkText=o=>Object.assign({id:uid(),type:'text',x:10,y:40,w:50,text:'Text',font:'System',size:5,color:'#ffffff',weight:400,italic:false,caps:false,align:'left',ls:0,op:1},o);
const mkBox =o=>Object.assign({id:uid(),type:'box',x:10,y:10,w:30,h:15,src:null,fill:'',fit:'cover',r:0,op:1},o);
const mkNfc =o=>Object.assign({id:uid(),type:'nfc',x:91.2,y:88.4,w:5.4,h:7.9,color:'#ffffff',op:.85},o);
function template(v={}){
  const c=v.c3||'#ffffff', lab={size:3,caps:true,ls:.05,op:1,color:'#4b8fe8',weight:700}, val={size:6.5,weight:500,color:c};
  return {card:{w:100,ratio:845/742,r:1.4,bg:v.bg||'#22262d',notch:true,screen:'#000000',stack:true,stackColor:'#2c62ad'},els:[

function extraFields(c='#ffffff'){

function upgrade(t){  // add Entry Info / Ticket Type to tickets made before they existed
  if(t.els.some(e=>e.tag==='entry'))return;
  t.els.forEach(e=>{if(e.type==='text'&&/^(section|row|seat)$/i.test(e.text)&&e.caps&&e.color==='#ffffff'){e.color='#4b8fe8';e.weight=700;e.op=1}});

/* ---------- drawing a card ---------- */
function lum(hex){const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})/i.exec(hex||'');if(!m)return 0;const [r,g,b]=m.slice(1).map(x=>parseInt(x,16)/255);return .2126*r+.7152*g+.0722*b}
const demoStyle=bg=>lum(bg)>.55?'color:rgba(0,0,0,.45);text-shadow:0 0 2px rgba(255,255,255,.6)':'color:rgba(255,255,255,.42);text-shadow:0 0 2px rgba(0,0,0,.6)';
const NFC='<svg viewBox="0 0 20 28" overflow="visible" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11c1.2 1.8 1.2 4.2 0 6"/><path d="M7.5 8c2.2 3.6 2.2 8.4 0 12"/><path d="M12 5c3.3 5.4 3.3 12.6 0 18"/><path d="M16.5 2c4.4 7.2 4.4 16.8 0 24"/></svg>';

function elHTML(e,W,edit,selId){
  const isSel=edit&&e.id===selId, hd=isSel?'<i class="hd"></i>':'';
  const base=`left:${e.x}%;top:${e.y}%;width:${e.w}%;opacity:${e.op};`;
  const cls=`el ${e.type==='text'?'txt':e.type}${isSel?' sel':''}`;
  if(e.type==='text'){
    const st=`${base}font-family:${(FONTS[e.font]||FONTS.System).replace(/"/g,"'")};font-size:${r2(e.size/100*W)}px;color:${e.color};font-weight:${e.weight};font-style:${e.italic?'italic':'normal'};text-align:${e.align};letter-spacing:${e.ls}em;text-transform:${e.caps?'uppercase':'none'}`;
    const body=esc(e.text)||(edit?'<span style="opacity:.35">Empty text</span>':'&nbsp;');
    return `<div class="${cls}" data-id="${e.id}" style="${st}">${body}${hd}</div>`;
  }
  if(e.type==='box'){
    const empty=!e.src&&!e.fill;
    const st=`${base}height:${e.h}%;background-color:${e.fill||'transparent'};${e.src?`background-image:url(${e.src});background-size:${e.fit};`:''}border-radius:${r2(e.r/100*W)}px`;
    return `<div class="${cls}${empty?' empty':''}" data-id="${e.id}" style="${st}">${hd}</div>`;
  }
  return `<div class="${cls}" data-id="${e.id}" style="${base}height:${e.h}%;color:${e.color}">${NFC}${hd}</div>`;
}
function cardHTML(t,W,edit,selId){
  const c=t.card,H=W*c.ratio;
  const m=`radial-gradient(circle ${r2(.0973*W)}px at 50% ${r2(-.054*W)}px,transparent 97%,#000 100%)`;
  const notch=c.notch?`-webkit-mask:${m};mask:${m};`:'';
  return `<div class="tk" style="width:${r2(W)}px;height:${r2(H)}px;background:${c.bg};border-radius:${r2(c.r/100*W)}px;${notch}">`+
    t.els.map(e=>elHTML(e,W,edit,selId)).join('')+
    `<div class="demo" style="${demoStyle(c.bg)}">Demo</div>`+
    (edit?'<div class="gv"></div><div class="gh"></div>':'')+`</div>`;
}

/* ---------- images ---------- */
function shrink(blob,max=1100){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);
  let alpha=false;try{const d=g.getImageData(0,0,c.width,c.height).data;for(let k=3;k<d.length;k+=16){if(d[k]<250){alpha=true;break}}}catch(x){}
  res({src:alpha?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85),ar:c.height/c.width})};im.src=fr.result};fr.readAsDataURL(blob)})}
async function clipImage(){
  try{const items=await navigator.clipboard.read();
    for(const it of items){const ty=it.types.find(x=>x.startsWith('image/'));if(ty)return await it.getType(ty)}
    alert('No image copied yet. Copy an image first, then tap Paste.')}
  catch(e){alert('Paste isn’t available here. Use Choose photo instead.')}
  return null;
}

const selEl=()=>cur().els.find(e=>e.id===sel)||null;
function pushHist(force){const n=Date.now();if(force||n-lastHist>700){hist.push(JSON.stringify(cur()));if(hist.length>60)hist.shift();$('undo').disabled=false}lastHist=n}
function drawEd(){
  const c=cur().card,sw=stage.clientWidth-24,sh=stage.clientHeight-24;
  curW=Math.max(120,Math.min(sw*c.w/100,sh/c.ratio));curH=curW*c.ratio;

}

/* ---------- panel ---------- */
const FMT={size:v=>Math.round(v*3.7)+' pt',ls:v=>(+v).toFixed(2),op:v=>Math.round(v*100)+'%',r:v=>(+v).toFixed(1),w:v=>Math.round(v)+'%',ratio:v=>Math.round(v*100)+'%'};
function rng(o,lab,p,min,max,step,scope=''){return `<label>${lab}</label><div class="rowx"><input type="range" data-p="${p}" ${scope?`data-scope="${scope}"`:''} min="${min}" max="${max}" step="${step}" value="${o[p]}"><span class="val" data-v="${p}">${(FMT[p]||String)(o[p])}</span></div>`}
function seg(o,p,opts,scope=''){return `<div class="seg">${opts.map(([v,l])=>`<button data-act="set" data-p="${p}" data-val="${v}" ${scope?`data-scope="${scope}"`:''} class="${String(o[p])===String(v)?'on':''}">${l}</button>`).join('')}</div>`}
const layerBtns='<div class="pbs"><button class="pb" data-act="back">Send back</button><button class="pb" data-act="fwd">Bring forward</button><button class="pb" data-act="dup">Duplicate</button><button class="pb dan" data-act="del">Delete</button></div>';

      <div class="rowx"><div><label>Font</label><select data-p="font">${Object.keys(FONTS).map(f=>`<option ${f===E.font?'selected':''} style="font-family:${FONTS[f].replace(/"/g,"'")}">${f}</option>`).join('')}</select></div>
      <div><label>Weight</label><select data-p="weight" data-num>${WEIGHTS.map(([v,l])=>`<option value="${v}" ${v==E.weight?'selected':''}>${l}</option>`).join('')}</select></div></div>
      ${rng(E,'Size','size',1.5,22,.1)}
      <div class="rowx"><div><label>Color</label><input type="color" data-p="color" value="${E.color}"></div>
      <div><label>Style</label><div class="seg"><button data-act="bold" class="${E.weight>=600?'on':''}"><b>Bold</b></button><button data-act="toggle" data-p="italic" class="${E.italic?'on':''}"><i>Italic</i></button><button data-act="toggle" data-p="caps" class="${E.caps?'on':''}">CAPS</button></div></div></div>
      <label>Align</label>${seg(E,'align',[['left','Left'],['center','Center'],['right','Right']])}
      ${rng(E,'Letter spacing','ls',-.05,.4,.01)}${rng(E,'Opacity','op',.1,1,.05)}${layerBtns}`;
    }else if(E.type==='box'){
      h=`<label>Image</label><div class="pbs" style="margin-top:0"><button class="pb pri" data-act="imgChoose">Choose photo</button><button class="pb" data-act="imgPaste">Paste</button><button class="pb dan" data-act="imgRemove">Remove</button></div>
      ${E.src?`<label>Image fit</label>${seg(E,'fit',[['cover','Fill box'],['contain','Show whole image']])}`:''}
      <div class="rowx"><div><label>Background color</label><input type="color" data-p="fill" value="${E.fill||'#2f6bd6'}"></div><div><label>&nbsp;</label><button class="pb" style="width:100%" data-act="nofill">No color</button></div></div>
      ${rng(E,'Rounded corners','r',0,20,.5)}${rng(E,'Opacity','op',.1,1,.05)}${layerBtns}`;
    }else{
      h=`<label>Color</label><input type="color" data-p="color" value="${E.color}">${rng(E,'Opacity','op',.1,1,.05)}${layerBtns}`;
    }
  }else if(tab==='card'){
    h=`${rng(c,'Card width','w',60,100,1,'card')}${rng(c,'Card height','ratio',.5,1.8,.01,'card')}${rng(c,'Rounded corners','r',0,8,.1,'card')}
    <div class="rowx"><div><label>Card color</label><input type="color" data-p="bg" data-scope="card" value="${c.bg}"></div>
    <div><label>Notch at top</label>${seg(c,'notch',[['true','On'],['false','Off']],'card')}</div></div>
    <div class="rowx"><div><label>Screen background</label><input type="color" data-p="screen" data-scope="card" value="${c.screen}"></div>
    <div><label>Cards at bottom</label>${seg(c,'stack',[['true','Show'],['false','Hide']],'card')}</div></div>
    <label>Front bottom card color</label><input type="color" data-p="stackColor" data-scope="card" value="${c.stackColor}">
    <div class="pbs"><button class="pb dan" data-act="reset">Reset to original design</button></div>`;
  }else{
    h=`<div class="tnav"><button data-act="tkPrev">‹</button><span>Ticket ${i+1} of ${T.length}</span><button data-act="tkNext">›</button></div>
    <div class="pbs"><button class="pb pri" data-act="tkAdd">Duplicate ticket</button><button class="pb dan" data-act="tkDel">Delete ticket</button></div>
    <label>Lock screen wallpaper</label><div class="pbs" style="margin-top:0"><button class="pb" data-act="wpChoose">Choose photo</button><button class="pb" data-act="wpDefault">Default</button></div>
    <label>Backup</label><div class="pbs" style="margin-top:0"><button class="pb" data-act="backup">Back up tickets</button><button class="pb" data-act="restore">Restore backup</button></div>`;
  }
  panel.innerHTML=h;
}

/* panel inputs: sliders, colors, text, selects */
function onField(e){
  const el=e.target,p=el.dataset.p;if(!p)return;
  const tgt=el.dataset.scope==='card'?cur().card:selEl();if(!tgt)return;
  const v=(el.type==='range'||el.dataset.num!==undefined)?parseFloat(el.value):el.value;
  if(tgt[p]===v)return;
  pushHist();tgt[p]=v;
  const vv=panel.querySelector(`[data-v="${p}"]`);if(vv)vv.textContent=(FMT[p]||String)(v);
  save();drawEd();
}
panel.addEventListener('input',onField);panel.addEventListener('change',onField);

function addText(){
  pushHist(true);const dark=lum(cur().card.bg)<.55;
  const E=mkText({x:10,y:42,w:60,text:'New text',size:6,color:dark?'#ffffff':'#111111'});
  cur().els.push(E);sel=E.id;tab='item';save();drawEd();drawPanel();
  const ta=panel.querySelector('textarea');if(ta){ta.focus();ta.select()}
}
async function placeImage(blob,mode){
  if(!blob)return;
  let im;try{im=await shrink(blob)}catch(x){alert('That image couldn’t be opened.');return}
  pushHist(true);
  if(mode==='new'){
    const w=45,h=Math.min(80,w*curW*im.ar/curH);
    const E=mkBox({x:(100-w)/2,y:(100-h)/2,w,h,src:im.src,fit:'contain'});cur().els.push(E);sel=E.id;
  }else{const E=selEl();if(E)E.src=im.src}
  tab='item';save();drawEd();drawPanel();
}
$('fimg').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)await placeImage(f,pendingImg)};

const ACT={
  addT:addText,
  addI(){pendingImg='new';$('fimg').click()},
  async pasteNew(){await placeImage(await clipImage(),'new')},
  set(b){const tgt=b.dataset.scope==='card'?cur().card:selEl();if(!tgt)return;let v=b.dataset.val;if(v==='true'||v==='false')v=v==='true';pushHist(true);tgt[b.dataset.p]=v;save();drawEd();drawPanel()},
  bold(){const E=selEl();if(!E)return;pushHist(true);E.weight=E.weight>=600?400:700;save();drawEd();drawPanel()},
  toggle(b){const E=selEl();if(!E)return;pushHist(true);E[b.dataset.p]=!E[b.dataset.p];save();drawEd();drawPanel()},
  fwd(){move(1)},back(){move(-1)},
  dup(){const E=selEl();if(!E)return;pushHist(true);const c=Object.assign(JSON.parse(JSON.stringify(E)),{id:uid(),x:E.x+3,y:E.y+3});cur().els.splice(cur().els.indexOf(E)+1,0,c);sel=c.id;save();drawEd();drawPanel()},
  del(){const E=selEl();if(!E)return;pushHist(true);cur().els.splice(cur().els.indexOf(E),1);sel=null;save();drawEd();drawPanel()},
  imgChoose(){pendingImg='replace';$('fimg').click()},
  async imgPaste(){await placeImage(await clipImage(),'replace')},
  imgRemove(){const E=selEl();if(!E||!E.src)return;pushHist(true);E.src=null;save();drawEd();drawPanel()},
  nofill(){const E=selEl();if(!E)return;pushHist(true);E.fill='';save();drawEd();drawPanel()},
  reset(){if(!confirm('Reset this ticket to the original design? Your text and images on it will be replaced.'))return;pushHist(true);T[i]=template();sel=null;save();drawEd();drawPanel()},
  tkPrev(){if(i>0){i--;switchTk()}},tkNext(){if(i<T.length-1){i++;switchTk()}},
  tkAdd(){const c=JSON.parse(JSON.stringify(cur()));c.els.forEach(e=>e.id=uid());T.splice(i+1,0,c);i++;switchTk()},
  tkDel(){if(T.length<2){alert('You need at least one ticket.');return}if(!confirm('Delete this ticket?'))return;T.splice(i,1);i=Math.max(0,i-1);switchTk()},
  wpChoose(){$('fwp').click()},wpDefault(){resetWall()},
  backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(T)],{type:'application/json'}));a.download='my-tickets-backup.json';a.click()},
  restore(){$('imp').click()}
};
function move(d){const a=cur().els,E=selEl();if(!E)return;const k=a.indexOf(E),n=k+d;if(n<0||n>=a.length)return;pushHist(true);a.splice(k,1);a.splice(n,0,E);save();drawEd()}
function switchTk(){sel=null;hist=[];$('undo').disabled=true;save();render();drawEd();drawPanel()}
panel.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b)});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;drawPanel()}});
$('addT').onclick=addText;$('addI').onclick=()=>ACT.addI();

$('imp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(Array.isArray(d)&&d.length){T=d.map(migrate);i=0;switchTk()}else throw 0}catch(x){alert('That file isn’t a ticket backup.')}};fr.readAsText(f)};

/* ---------- drag, resize and snap ---------- */
stage.addEventListener('pointerdown',e=>{
  const elD=e.target.closest('.el');
  if(!elD){if(sel){sel=null;drawEd();drawPanel()}return}
  e.preventDefault();
  const id=elD.dataset.id,E=cur().els.find(x=>x.id===id),onHandle=e.target.classList.contains('hd');
  const now=Date.now(),dbl=sel===id&&now-lastDown<350;lastDown=now;
  if(sel!==id){sel=id;tab='item';drawEd();drawPanel()}
  if(dbl&&E.type==='text'){const ta=panel.querySelector('textarea');if(ta){ta.focus();ta.select()}return}
  const n=node(id);
  drag={id,mode:onHandle?'resize':'move',sx:e.clientX,sy:e.clientY,ox:E.x,oy:E.y,ow:E.w,oh:E.h,moved:false,pw:n.offsetWidth/curW*100,ph:n.offsetHeight/curH*100};
});
function snap(pos,size,targets){for(const t of targets){for(const off of [0,size/2,size]){if(Math.abs(pos+off-t)<1.4)return [t-off,t]}}return [pos,null]}
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<3)return;pushHist(true);drag.moved=true}
  const E=cur().els.find(x=>x.id===drag.id),n=node(drag.id);if(!E||!n)return;
  const dx=(e.clientX-drag.sx)/curW*100,dy=(e.clientY-drag.sy)/curH*100;
  const gv=stage.querySelector('.gv'),gh=stage.querySelector('.gh');
  if(drag.mode==='move'){
    const [nx,sx]=snap(drag.ox+dx,drag.pw,[50,0,100]),[ny,sy]=snap(drag.oy+dy,drag.ph,[50,0,100]);
    E.x=r2(nx);E.y=r2(ny);n.style.left=E.x+'%';n.style.top=E.y+'%';
    gv.style.display=sx==null?'none':'block';if(sx!=null)gv.style.left=sx+'%';
    gh.style.display=sy==null?'none':'block';if(sy!=null)gh.style.top=sy+'%';
  }else{
    E.w=r2(Math.max(3,drag.ow+dx));n.style.width=E.w+'%';
    if(E.type!=='text'){
      const keep=E.type==='nfc'||!!E.src;
      E.h=r2(keep?E.w*drag.oh/drag.ow:Math.max(2,drag.oh+dy));n.style.height=E.h+'%';
    }
  }
});
window.addEventListener('pointerup',()=>{if(!drag)return;const m=drag.moved;drag=null;
  stage.querySelectorAll('.gv,.gh').forEach(g=>g.style.display='none');if(m){save();drawEd()}});
window.addEventListener('pointercancel',()=>{drag=null});

function openEditor(){sel=null;tab='item';hist=[];$('undo').disabled=true;$('ed').classList.add('open');requestAnimationFrame(()=>{drawEd();drawPanel()})}
function closeEditor(){$('ed').classList.remove('open');sel=null;render()}
window.addEventListener('resize',()=>{render();if($('ed').classList.contains('open'))drawEd()});

// Full screen: installed (home-screen) mode is already full screen; in a normal
// Android browser tab, ask for full screen on the first open.
const standalone=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
function goFull(){
  if(standalone)return;
  const d=document.documentElement;
  try{(d.requestFullscreen||d.webkitRequestFullscreen)?.call(d,{navigationUI:'hide'})}catch(e){}
}

function edgeColor(){const open=$('pass').classList.contains('open');const c=open?cur().card.screen:'#140c09';
  document.documentElement.style.background=c;document.body.style.background=c;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=c}
const setPass=v=>{
  if(v)$('stack').classList.remove('hide');
  hideFab();
  $('pass').classList.toggle('open',v);
  edgeColor();
  if(v){goFull();if(navigator.vibrate)navigator.vibrate(12)}
};
$('done').onclick=()=>setPass(false);
$('edit').onclick=openEditor;
$('edDone').onclick=closeEditor;

let lastTap=0;
function dbl(e,fn){const n=Date.now();if(n-lastTap<350){fn();lastTap=0;e.preventDefault()}else lastTap=n}
$('lock').addEventListener('touchend',e=>dbl(e,()=>setPass(true)));
$('lock').addEventListener('dblclick',()=>setPass(true));
let tapT=null;
// Wallet-style: tap the ticket (or the cards) and the other cards slide away and stay gone.
// A phone tap can fire both a touch and a click event, so ignore repeats within 500ms.
let stackChanged=0;
function setStack(hidden){const n=Date.now();if(n-stackChanged<500)return;
  const st=$('stack');if(st.classList.contains('hide')===hidden)return;
  stackChanged=n;st.classList.toggle('hide',hidden);if(navigator.vibrate)navigator.vibrate(8)}
let taps=0,lastTapAt=0,fabT=null;
function showFab(){const f=$('editfab');f.classList.add('show');if(navigator.vibrate)navigator.vibrate(20);clearTimeout(fabT);fabT=setTimeout(hideFab,4000)}
function hideFab(){$('editfab').classList.remove('show');clearTimeout(fabT)}
$('editfab').addEventListener('click',e=>{e.stopPropagation();hideFab();openEditor()});
function ticketTap(){
  setStack(true);
  const n=Date.now();if(n-lastTapAt<100)return;          // same tap reported twice
  taps=(n-lastTapAt<450)?taps+1:1;lastTapAt=n;
  if(taps>=4){taps=0;showFab()}                           // 4 quick taps = edit button appears
}
$('track').addEventListener('click',ticketTap);
$('stack').addEventListener('click',ticketTap);
// tapping empty screen space (not the ticket) brings the cards back
$('pass').addEventListener('click',e=>{if(e.target.closest('#track,#stack,button'))return;setStack(false)});

let sx=null;
$('track').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('track').addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;sx=null;e.preventDefault();
  if(Math.abs(d)>40){i=d<0?Math.min(T.length-1,i+1):Math.max(0,i-1);render()}
  else ticketTap()});
// swipe down anywhere on the ticket screen = back to the lock screen
let sy0=null,sx0=null;
$('pass').addEventListener('touchstart',e=>{sy0=e.touches[0].clientY;sx0=e.touches[0].clientX},{passive:true});
$('pass').addEventListener('touchend',e=>{if(sy0==null)return;const dy=e.changedTouches[0].clientY-sy0,dx=e.changedTouches[0].clientX-sx0;sy0=null;
  if(dy>90&&Math.abs(dx)<70&&!$('ed').classList.contains('open'))setPass(false)});
// on a computer: double-click empty space = back to the lock screen
$('pass').addEventListener('dblclick',e=>{if(!e.target.closest('#track'))setPass(false)});

// Block pinch-zoom / double-tap zoom on iOS
document.addEventListener('gesturestart',e=>e.preventDefault());

// Custom wallpaper (stored on the phone)
const WKEY='myTicketsWall', wallSVG=$('wall').innerHTML;
function applyWall(){let w=null;try{w=localStorage.getItem(WKEY)}catch(e){}
  if(w){$('wall').innerHTML='';$('wall').style.backgroundImage=`url(${w})`}else{$('wall').style.backgroundImage='';$('wall').innerHTML=wallSVG}}
$('fwp').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,1400/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{localStorage.setItem(WKEY,c.toDataURL('image/jpeg',.85))}catch(x){alert('That photo is too large to save.')}applyWall()};im.src=fr.result};fr.readAsDataURL(f);e.target.value=''};
function resetWall(){try{localStorage.removeItem(WKEY)}catch(e){}applyWall()}
applyWall();

function clock(){const d=new Date();
  $('ltime').textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M/i,'');
  $('ldate').textContent=d.toLocaleDateString('en-US',{weekday:'short'})+' '+d.getDate()}
clock();setInterval(clock,5000);render();
</script>
</body>
</html>
